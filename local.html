<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local</title>
</head>
<body>
    <input type="file" style="display: none" onclick="(event) => event.stopPropagation()" />
</body>
<script>
    navigator.serviceWorker.register("sw.js");
    window.onclick = () => document.getElementsByTagName("input")[0].click();
    document.getElementsByTagName("input")[0].onchange = (event) => navigator.storage.getDirectory().then(root => root.getFileHandle(event.target.files[0].name, { create: true }).then(h => h.createWritable().then(w => w.write(event.target.files[0]).then(() => w.close().then(() => location.reload())))))
</script>
